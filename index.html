const screens=[
{label:'시작 화면',page:'intro',title:'다담과 함께 시작해요',desc:'다담을 처음 만나는 화면이에요. 시작하기를 누르면 사용 안내로 이어집니다.',points:['다담의 첫 화면과 시작 버튼을 확인해요.','안내에 따라 나에게 맞는 설정을 살펴봐요.']},
{label:'처음 사용 안내',page:'onboarding',title:'나에게 맞게 설정해요',desc:'다담과 편하게 이야기할 수 있도록 호칭과 말하기 속도 등을 차례로 살펴봐요.',points:['부르는 이름과 말하기 속도를 선택해요.','좋아하는 이야기와 기억할 내용을 확인해요.','필요한 설정은 나중에 이어서 할 수 있어요.']},
{label:'홈',page:'home',title:'다담과 하루를 시작해요',desc:'다담이 먼저 건네는 안부를 확인하고 편하게 대화를 시작해요.',points:['안부에 답하며 다담과 이야기를 나눠요.','추억 이야기와 머리 운동을 시작해요.','다음 약 알림과 오늘 걸음을 확인해요.']},
{label:'대화',page:'chat',title:'목소리로 편하게 이야기해요',desc:'다담과 마주 앉아 이야기하듯 대화를 이어가는 화면이에요.',points:['다담의 질문을 듣고 편하게 이야기해요.','대화를 잠시 멈추거나 마칠 수 있어요.'],note:'대화 화면의 흐름을 확인할 수 있으며, 실제 음성 인식과 AI 연동은 별도 연결이 필요해요.'},
{label:'약 알림',page:'meds',title:'약 먹을 시간을 챙겨요',desc:'등록한 약과 시간을 확인하고 나에게 맞게 알림을 관리해요.',points:['약 이름과 시간을 추가하거나 변경해요.','약 알림을 켜고 끌 수 있어요.','지난 알림 기록을 날짜별로 살펴봐요.'],note:'약 알림은 시간을 알려주는 기능이며 의료 지도나 실제 복용 확인을 뜻하지 않아요.'},
{label:'건강 기록',page:'health',title:'나의 생활 기록을 살펴봐요',desc:'오늘의 걸음과 직접 입력한 혈압 기록을 한곳에서 확인해요.',points:['걸음 기록과 지난 기록을 살펴봐요.','측정한 혈압과 맥박을 직접 입력해요.','지난 혈압 기록을 날짜별로 확인해요.'],note:'혈압은 직접 입력하는 기록이며 건강 상태를 진단하지 않아요.'},
{label:'가족',page:'lifefamily',title:'가족과 안부를 나눠요',desc:'가족의 안부와 소식을 확인하고 나의 안부도 남길 수 있어요.',points:['내 상태와 짧은 이야기를 남겨요.','가족의 안부와 소식을 살펴봐요.','연결된 가족과 공유 범위를 확인해요.'],note:'현재 화면에서 가족 간 실제 전송 및 데이터 연동은 별도 연결이 필요해요.'},
{label:'가족 리포트',page:'report',context:'family',title:'공유받은 기록을 확인해요',desc:'가족이 공유하기로 선택한 생활 기록을 리포트에서 살펴봐요.',points:['대상과 날짜를 선택해 기록을 확인해요.','공유된 약 알림 응답과 활동 기록을 살펴봐요.','공유 범위는 기록을 제공하는 가족이 선택해요.'],note:'화면의 기록은 예시이며 약 알림 응답은 실제 복용 확인이 아니에요.'},
{label:'추억 이야기',page:'story',title:'추억을 함께 나눠요',desc:'사진을 보며 기억나는 이야기를 다담과 나누는 화면이에요.',points:['추억을 떠올리며 이야기를 시작해요.','편안한 속도로 이야기를 이어가요.']},
{label:'머리 운동',page:'quiz',title:'가볍게 생각하며 놀아요',desc:'다담이 준비한 질문을 보며 천천히 답을 골라봐요.',points:['문제를 읽거나 다시 들어요.','답을 고르고 다음 문제로 넘어가요.','부담 없이 세 문제를 살펴봐요.']},
{label:'도움 요청',page:'help',title:'도움 요청 화면을 확인해요',desc:'도움이 필요할 때 연결된 가족에게 도움을 요청하는 흐름을 보여줘요.',points:['연결된 가족을 확인해요.','요청 전 내용을 살펴보고 취소할 수 있어요.'],note:'현재는 화면 흐름만 제공하며 실제 가족에게 요청이 전달되지 않아요.'},
{label:'설정',page:'settings',title:'내게 편한 환경으로 바꿔요',desc:'글씨 크기와 음성, 알림 등 사용 환경을 확인하고 조절해요.',points:['내 정보와 글씨 크기를 확인해요.','음성 및 알림 설정을 살펴봐요.','연결된 가족과 기록 공유 범위를 확인해요.']}
];
